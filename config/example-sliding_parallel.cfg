# This file contains the pin mappings for the BigTreeTech Octopus v1.1 for the Hex Printer

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1A003A000751313031393839-if00

[printer]
kinematics: sliding_parallel
max_velocity: 100
max_accel: 1000
max_z_velocity: 100
max_z_accel: 100
delta_radius = 110.000

[gcode_arcs]
resolution: 1.0

[delta_calibrate]
radius: 100

# Driver0
[stepper_a]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
endstop_pin: PG6
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
position_endstop: 450
homing_speed: 5
arm_length: 250.000

# Driver1
[stepper_b]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
endstop_pin: PG9
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
position_endstop: 450
homing_speed: 5
arm_length: 250.000

# Driver2
[stepper_c]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
endstop_pin: PG10
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
position_endstop: 450
homing_speed: 5
arm_length: 250.000

# Driver3
[stepper_d]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
endstop_pin: PG11
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
position_endstop: 450
homing_speed: 5
arm_length: 250.000

# Driver4
[stepper_e]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
endstop_pin: PG12
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
position_endstop: 450
homing_speed: 5
arm_length: 250.000

# Driver5
[stepper_f]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
endstop_pin: PG13
rotation_distance: 40
full_steps_per_rotation: 400
microsteps: 16
position_endstop: 450
arm_length: 250.000

#[filament_switch_sensor material_1]
#switch_pin: PG13

# Driver6
[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
heater_pin: PB10 # HE2
sensor_pin: PF6 # T2
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
#heater_pin: PA2 # HE0
#sensor_pin:  PF4 # T0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 0

#[filament_switch_sensor material_2]
#switch_pin: PG14

# Driver7
#[extruder3]
#step_pin: PE6
#dir_pin: PA14
#enable_pin: !PE0
#heater_pin: PB11 # HE3
#sensor_pin: PF7 # T3
#...

#[filament_switch_sensor material_3]
#switch_pin: PG15

# Using the heater bed from a SOVOL SV06
[heater_bed]
heater_pin: PA1
sensor_pin: PF3 # TB
sensor_type: EPCOS 100K B57560G104F
#control: pid
#pid_Kp: 60.000
#pid_Ki: 1.000
#pid_Kd: 1000.000
min_temp: 0
max_temp: 110

[fan]
pin: PA8

#[heater_fan fan1]
#pin: PE5

#[heater_fan fan2]
#pin: PD12

#[heater_fan fan3]
#pin: PD13

#[heater_fan fan4]
#pin: PD14

#[controller_fan fan5]
#pin: PD15

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_a]
uart_pin: PC4
#diag_pin: PG6
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_b]
uart_pin: PD11
#diag_pin: PG9
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_c]
uart_pin: PC6
#diag_pin: PG10
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_d]
uart_pin: PC7
#diag_pin: PG11
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_e]
uart_pin: PF2
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_f]
uart_pin: PE4
run_current: 0.800
stealthchop_threshold: 999999

#[tmc2209 extruder]
#uart_pin: PE1
#run_current: 0.800
#stealthchop_threshold: 999999

#[tmc2209 extruder3]
#uart_pin: PD3
#run_current: 0.800
#stealthchop_threshold: 999999

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

